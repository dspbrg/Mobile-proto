<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Daan is waiting…</title>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --brand-darkblue: #001489;
      --brand-orange: #ff8200;
      --brand-cyan: #00b6e7;
      --neutral-50: #f3f4f6;
      --neutral-300: #b6bec8;
      --neutral-700: #505862;
      --white: #ffffff;
      --radius-sm: 8px;
      --radius-round: 360px;
    }

    html, body {
      height: 100%;
      font-family: 'Ubuntu', sans-serif;
      background: #e8e8e8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    @media (max-width: 500px) {
      html, body {
        background: var(--white);
        height: 100dvh;
        overflow: hidden;
      }
    }

    .phone-frame {
      width: 375px;
      height: 844px;
      background: var(--white);
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 500px) {
      .phone-frame {
        width: 100%;
        height: 100dvh;
        box-shadow: none;
      }
    }

    .header {
      background: var(--brand-darkblue);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .header img {
      height: 24px;
      width: auto;
    }

    .header .webshop {
      font-family: 'Ubuntu', sans-serif;
      font-weight: 700;
      font-style: italic;
      color: #66D3F1;
      font-size: 16px;
      line-height: 24px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 32px;
      text-align: center;
    }

    .waiting-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--brand-darkblue);
      line-height: 1.2;
    }

    .waiting-title .name {
      color: var(--brand-orange);
    }

    .timer-card {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-round);
      background: var(--brand-darkblue);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 0 8px 24px rgba(0, 20, 137, 0.25);
    }

    .timer-card::before {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: var(--radius-round);
      border: 2px dashed rgba(102, 211, 241, 0.4);
    }

    .timer-value {
      font-size: 72px;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
    }

    .timer-unit {
      margin-top: 8px;
      font-size: 14px;
      font-weight: 500;
      color: #66D3F1;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .timer-sub {
      font-size: 14px;
      color: var(--neutral-700);
      max-width: 260px;
    }

    .controls {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 320px;
    }

    .btn {
      flex: 1;
      height: 44px;
      border-radius: var(--radius-round);
      border: none;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--brand-cyan);
      color: var(--white);
    }

    .btn-secondary {
      background: transparent;
      color: var(--brand-darkblue);
      border: 1.5px solid var(--brand-darkblue);
    }

    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="header">
      <img src="../images/action-logo.svg" alt="Action" />
      <span class="webshop">webshop</span>
    </div>

    <div class="content">
      <h1 class="waiting-title">
        <span class="name">Daan</span> is waiting for<br />
        <span id="display-minutes">5</span> minutes.
      </h1>

      <div class="timer-card" aria-live="polite">
        <div class="timer-value" id="timer">05:00</div>
        <div class="timer-unit">minutes</div>
      </div>

      <p class="timer-sub">We laten je weten zodra het zover is.</p>

      <div class="controls">
        <button class="btn btn-secondary" id="reset-btn">Reset</button>
        <button class="btn btn-primary" id="toggle-btn">Pauze</button>
      </div>
    </div>
  </div>

  <script>
    const START_SECONDS = 5 * 60;
    let remaining = START_SECONDS;
    let running = true;
    let intervalId = null;

    const timerEl = document.getElementById('timer');
    const displayMinutesEl = document.getElementById('display-minutes');
    const toggleBtn = document.getElementById('toggle-btn');
    const resetBtn = document.getElementById('reset-btn');

    function format(seconds) {
      const m = Math.floor(seconds / 60).toString().padStart(2, '0');
      const s = (seconds % 60).toString().padStart(2, '0');
      return `${m}:${s}`;
    }

    function render() {
      timerEl.textContent = format(remaining);
      const minutesLeft = Math.ceil(remaining / 60);
      displayMinutesEl.textContent = minutesLeft;
    }

    function tick() {
      if (remaining <= 0) {
        clearInterval(intervalId);
        intervalId = null;
        running = false;
        toggleBtn.textContent = 'Klaar';
        toggleBtn.disabled = true;
        return;
      }
      remaining -= 1;
      render();
    }

    function start() {
      if (intervalId) return;
      intervalId = setInterval(tick, 1000);
      running = true;
      toggleBtn.textContent = 'Pauze';
    }

    function pause() {
      clearInterval(intervalId);
      intervalId = null;
      running = false;
      toggleBtn.textContent = 'Hervat';
    }

    toggleBtn.addEventListener('click', () => {
      if (running) pause(); else start();
    });

    resetBtn.addEventListener('click', () => {
      remaining = START_SECONDS;
      toggleBtn.disabled = false;
      render();
      pause();
      start();
    });

    render();
    start();
  </script>
</body>
</html>
